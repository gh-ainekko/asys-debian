name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            upstream/dcomp/go.sum
            upstream/asys/asys-inference/go.sum

      - name: Build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            debhelper dh-python devscripts fakeroot python3-pip zstd

      - name: Build packages
        run: ci/build-all.sh

      - name: Smoke test (install + team workflow as a second user)
        run: sudo ci/smoke-test.sh build/dist

      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: build/dist/*.deb
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/*.deb
          generate_release_notes: true
