# asys-server configuration. Sourced by the asys-server helpers (sh syntax,
# KEY=VALUE only) and by asys-dashboard.service (EnvironmentFile).
ASYS_HOME=/srv/asys
ASYS_STATE_ROOT=/srv/asys/state
DCOMP_STATE_ROOT=/srv/asys/dcomp
ASYS_GROUP=asys
ASYS_USER=asys
# The dashboard binds 127.0.0.1 only; front it with a reverse proxy
# (see /usr/share/asys-server/nginx-asys-dashboard.conf).
ASYS_DASHBOARD_PORT=8766
# Extra arguments, e.g. "--allow-host asys.example.com:8765" when the proxy
# forwards the public Host header instead of rewriting it.
ASYS_DASHBOARD_ARGS=
